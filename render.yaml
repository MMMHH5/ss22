services:
  - type: web
    name: laxalab-api-public
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DENY_ADMIN_AUD
        value: "1"
      - key: REQUIRE_OBJECT_STORAGE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: laxalab-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: laxalab-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://laxalab-web-learner.onrender.com
      - key: CORS_ORIGINS
        value: https://laxalab.com,https://www.laxalab.com
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: laxalab-api-admin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SURFACE
        value: "1"
      - key: REQUIRE_OBJECT_STORAGE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: laxalab-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: laxalab-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://laxalab-web-admin.onrender.com
      - key: CORS_ORIGINS
        value: https://laxalab.com,https://www.laxalab.com
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: laxalab-web-learner
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ar
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: learner
      - key: NEXT_PUBLIC_API_URL
        value: https://laxalab-api-public.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://laxalab-web-learner.onrender.com

  - type: web
    name: laxalab-web-admin
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ar
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: admin
      - key: NEXT_PUBLIC_API_URL
        value: https://laxalab-api-admin.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://laxalab-web-admin.onrender.com

  - type: keyvalue
    name: laxalab-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: laxalab-postgres
    databaseName: laxalab
    user: laxalab
    plan: free
    region: frankfurt
    ipAllowList: []
